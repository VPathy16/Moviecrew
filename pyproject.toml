[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moviecrew"
version = "0.1.0"
description = "A model-agnostic multi-agent pipeline that turns a concept into a shot-by-shot Veo prompt pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
video = ["google-genai>=1.0"]
portal = ["fastapi>=0.110", "uvicorn>=0.30"]
# httpx2 backs starlette's TestClient, which the portal tests run through.
# Without it `pip install -e ".[dev,portal]"` collects fastapi but still cannot
# run those tests — recent starlette raises RuntimeError on the missing client.
dev = ["pytest>=8", "pyflakes>=3", "httpx2>=0.28"]

[tool.setuptools.packages.find]
include = ["moviecrew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
